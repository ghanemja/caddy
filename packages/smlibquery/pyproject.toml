[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smlibquery"
version = "0.1.0"
description = "A CadQuery-style API on NVIDIA SMLib (usd-brep): exact B-rep, expressions kept, safe scripts. Not CadQuery."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["usd-brep==1.0.1"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["smlibquery"]
