name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # usd-brep (SMLib) ships cp312 wheels only
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: tests
        run: .venv/bin/python -m pytest -q tests packages/smlibquery/tests
